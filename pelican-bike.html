<!doctype html>
<html lang="zh-CN" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f0e8" />
    <meta
      name="description"
      content="一只鹈鹕骑着自行车沿着海岸前进的动效插画。"
    />
    <title>鹈鹕，出发。 | 海风图鉴</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #173247;
        --ink-soft: #4f6570;
        --paper: #f3f0e8;
        --paper-deep: #e8e2d6;
        --panel: #faf8f2;
        --panel-border: rgba(23, 50, 71, 0.13);
        --sky-top: #b8dfe1;
        --sky-bottom: #f3c9a3;
        --sun: #f3ac5c;
        --water: #5aa9ae;
        --water-deep: #347f8b;
        --sand: #e9c789;
        --road: #e7dbc3;
        --road-line: #efb56f;
        --accent: #e67858;
        --accent-deep: #b94d47;
        --bird: #f8f2e6;
        --bird-shadow: #d6e3dd;
        --shadow: rgba(23, 50, 71, 0.16);
        --button-ink: #f9f5ec;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          color-scheme: dark;
          --ink: #edf2eb;
          --ink-soft: #a9bdbe;
          --paper: #172c38;
          --paper-deep: #203d49;
          --panel: #1e3a46;
          --panel-border: rgba(237, 242, 235, 0.14);
          --sky-top: #244e5d;
          --sky-bottom: #725b54;
          --sun: #efa65e;
          --water: #28727c;
          --water-deep: #185b69;
          --sand: #b28a5b;
          --road: #35525b;
          --road-line: #eba661;
          --accent: #ef8966;
          --accent-deep: #ffb07e;
          --bird: #f2ede1;
          --bird-shadow: #b8cfca;
          --shadow: rgba(2, 16, 24, 0.35);
          --button-ink: #173247;
        }
      }

      :root[data-theme='dark'] {
        color-scheme: dark;
        --ink: #edf2eb;
        --ink-soft: #a9bdbe;
        --paper: #172c38;
        --paper-deep: #203d49;
        --panel: #1e3a46;
        --panel-border: rgba(237, 242, 235, 0.14);
        --sky-top: #244e5d;
        --sky-bottom: #725b54;
        --sun: #efa65e;
        --water: #28727c;
        --water-deep: #185b69;
        --sand: #b28a5b;
        --road: #35525b;
        --road-line: #eba661;
        --accent: #ef8966;
        --accent-deep: #ffb07e;
        --bird: #f2ede1;
        --bird-shadow: #b8cfca;
        --shadow: rgba(2, 16, 24, 0.35);
        --button-ink: #173247;
      }

      :root[data-theme='light'] {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--paper);
      }

      body {
        min-width: 320px;
        min-height: 100dvh;
        margin: 0;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 8% 12%, rgba(255, 255, 255, 0.42), transparent 23rem),
          var(--paper);
        color: var(--ink);
        font-family:
          'Avenir Next', 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      body::before {
        position: fixed;
        z-index: 2;
        inset: 0;
        pointer-events: none;
        opacity: 0.23;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.72' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");
        content: '';
        mix-blend-mode: multiply;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) body::before {
          opacity: 0.12;
          mix-blend-mode: screen;
        }
      }

      :root[data-theme='dark'] body::before {
        opacity: 0.12;
        mix-blend-mode: screen;
      }

      button,
      a {
        font: inherit;
      }

      button {
        border: 0;
      }

      button:focus-visible,
      a:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 4px;
      }

      .page-shell {
        position: relative;
        z-index: 1;
        width: min(100% - 48px, 1440px);
        min-height: 100dvh;
        margin: 0 auto;
        padding: 24px 0 22px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 44px;
      }

      .wordmark {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        color: var(--ink);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-decoration: none;
      }

      .wordmark-mark {
        position: relative;
        display: inline-block;
        width: 30px;
        height: 30px;
        overflow: hidden;
        border: 2px solid var(--ink);
        border-radius: 50%;
      }

      .wordmark-mark::before,
      .wordmark-mark::after {
        position: absolute;
        width: 17px;
        height: 2px;
        border-radius: 2px;
        background: var(--accent);
        content: '';
      }

      .wordmark-mark::before {
        top: 9px;
        left: 5px;
        transform: rotate(-32deg);
      }

      .wordmark-mark::after {
        right: 4px;
        bottom: 8px;
        transform: rotate(-32deg);
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .topbar-note {
        color: var(--ink-soft);
        font-size: 12px;
        letter-spacing: 0.04em;
      }

      .theme-toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 36px;
        padding: 0 13px;
        border: 1px solid var(--panel-border);
        border-radius: 999px;
        background: color-mix(in srgb, var(--panel) 76%, transparent);
        color: var(--ink);
        cursor: pointer;
        font-size: 12px;
        font-weight: 700;
        transition:
          transform 180ms ease,
          border-color 180ms ease,
          background 180ms ease;
      }

      .theme-toggle::before {
        display: block;
        width: 9px;
        height: 9px;
        border: 1.5px solid currentColor;
        border-radius: 50%;
        content: '';
      }

      .theme-toggle:hover {
        border-color: var(--accent);
        background: var(--panel);
        transform: translateY(-1px);
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(250px, 0.78fr) minmax(0, 1.22fr);
        align-items: center;
        gap: clamp(32px, 5vw, 90px);
        min-height: calc(100dvh - 90px);
        padding: 26px 0 18px;
      }

      .hero-copy {
        position: relative;
        z-index: 1;
        max-width: 500px;
        padding-left: clamp(0px, 2vw, 28px);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin: 0 0 22px;
        color: var(--accent-deep);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.18em;
      }

      .eyebrow::before {
        width: 26px;
        height: 2px;
        border-radius: 2px;
        background: var(--accent);
        content: '';
      }

      h1 {
        max-width: 7ch;
        margin: 0;
        color: var(--ink);
        font-size: clamp(4rem, 7vw, 7.6rem);
        font-weight: 850;
        letter-spacing: -0.085em;
        line-height: 0.94;
      }

      h1 span {
        display: inline-block;
        color: var(--accent);
      }

      .hero-description {
        max-width: 19em;
        margin: 28px 0 0;
        color: var(--ink-soft);
        font-size: clamp(15px, 1.55vw, 18px);
        line-height: 1.75;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        margin-top: 32px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 50px;
        padding: 0 21px;
        border-radius: 999px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.03em;
        transition:
          transform 180ms ease,
          box-shadow 180ms ease,
          background 180ms ease,
          border-color 180ms ease;
      }

      .button:active {
        transform: translateY(1px) scale(0.98);
      }

      .button-primary {
        background: var(--ink);
        box-shadow: 0 12px 26px var(--shadow);
        color: var(--button-ink);
      }

      .button-primary:hover {
        background: var(--accent-deep);
        box-shadow: 0 15px 28px var(--shadow);
        transform: translateY(-2px);
      }

      .button-secondary {
        border: 1px solid var(--panel-border);
        background: transparent;
        color: var(--ink);
      }

      .button-secondary:hover {
        border-color: var(--accent);
        background: color-mix(in srgb, var(--accent) 10%, transparent);
        transform: translateY(-2px);
      }

      .scene-wrap {
        position: relative;
        min-width: 0;
      }

      .scene-card {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--panel-border);
        border-radius: 32px;
        background: var(--panel);
        box-shadow: 0 24px 70px var(--shadow);
        transform: rotate(1.1deg);
        transition: transform 500ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      .scene-card:hover {
        transform: rotate(0deg) translateY(-4px);
      }

      .scene-art {
        display: block;
        width: 100%;
        height: auto;
      }

      .scene-label {
        position: absolute;
        right: 22px;
        bottom: 20px;
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 31px;
        padding: 0 12px;
        border: 1px solid rgba(255, 250, 236, 0.44);
        border-radius: 999px;
        background: #173247;
        color: #f8f2e6;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.05em;
      }

      .scene-label::before {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        content: '';
      }

      .route-info {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin: 0;
        padding: 18px 0 0;
        border-top: 1px solid var(--panel-border);
      }

      .route-info div {
        display: grid;
        gap: 5px;
      }

      .route-info dt {
        color: var(--ink-soft);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      .route-info dd {
        margin: 0;
        color: var(--ink);
        font-size: 14px;
        font-weight: 800;
      }

      .lower-note {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding-top: 18px;
        color: var(--ink-soft);
        font-size: 11px;
        letter-spacing: 0.04em;
      }

      .lower-note p {
        margin: 0;
      }

      .lower-note p:last-child {
        text-align: right;
      }

      .scene-art .sky-texture {
        opacity: 0.22;
      }

      .scene-art .cloud {
        opacity: 0.58;
      }

      .scene-art .wave-line {
        fill: none;
        stroke: rgba(239, 248, 235, 0.44);
        stroke-linecap: round;
        stroke-width: 3;
      }

      .scene-art .wave-line.small {
        stroke-width: 2;
      }

      .scene-art .wind-line {
        fill: none;
        stroke: rgba(255, 249, 235, 0.64);
        stroke-linecap: round;
        stroke-width: 3;
      }

      .scene-art .ride-cycle {
        transform-box: view-box;
        transform-origin: 360px 500px;
      }

      .scene-art .wheel {
        transform-box: fill-box;
        transform-origin: center;
      }

      .scene-art .scarf-tail {
        transform-box: fill-box;
        transform-origin: 0% 50%;
      }

      .scene-art .bell-ring {
        transform-box: fill-box;
        transform-origin: center;
      }

      .is-riding .scene-art .ride-cycle {
        animation: rider-bob 1.8s ease-in-out infinite;
      }

      .is-riding .scene-art .wheel {
        animation: wheel-spin 0.82s linear infinite;
      }

      .is-riding .scene-art .wave-line,
      .is-riding .scene-art .wind-line {
        animation: wind-slide 3.8s ease-in-out infinite alternate;
      }

      .is-riding .scene-art .wind-line:nth-child(2),
      .is-riding .scene-art .wave-line:nth-child(2) {
        animation-delay: -1.3s;
      }

      .is-ringing .scene-art .bell-ring {
        animation: bell-ring 520ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      @keyframes rider-bob {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-4px) rotate(-0.7deg);
        }
      }

      @keyframes wheel-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes wind-slide {
        0% {
          opacity: 0.38;
          transform: translateX(0);
        }
        100% {
          opacity: 0.82;
          transform: translateX(13px);
        }
      }

      @keyframes bell-ring {
        0%,
        100% {
          transform: rotate(0deg);
        }
        25% {
          transform: rotate(15deg);
        }
        75% {
          transform: rotate(-12deg);
        }
      }

      @media (max-width: 900px) {
        .page-shell {
          width: min(100% - 34px, 700px);
        }

        .hero {
          grid-template-columns: 0.82fr 1.18fr;
          gap: 28px;
        }

        h1 {
          font-size: clamp(3.5rem, 8vw, 5.6rem);
        }

        .hero-description {
          font-size: 15px;
        }

        .button {
          padding: 0 17px;
        }
      }

      @media (max-width: 680px) {
        .page-shell {
          width: min(100% - 28px, 520px);
          padding-top: 16px;
        }

        .topbar-note {
          display: none;
        }

        .theme-toggle {
          min-height: 34px;
          padding: 0 11px;
        }

        .hero {
          display: flex;
          flex-direction: column;
          align-items: stretch;
          gap: 32px;
          min-height: auto;
          padding: 52px 0 20px;
        }

        .hero-copy {
          max-width: none;
          padding-left: 0;
        }

        .eyebrow {
          margin-bottom: 16px;
        }

        h1 {
          max-width: none;
          font-size: clamp(4.3rem, 19vw, 6.8rem);
          letter-spacing: -0.1em;
        }

        .hero-description {
          max-width: 24em;
          margin-top: 20px;
        }

        .actions {
          margin-top: 24px;
        }

        .scene-card {
          border-radius: 24px;
          transform: rotate(0deg);
        }

        .scene-card:hover {
          transform: none;
        }

        .route-info {
          gap: 12px;
          padding-top: 15px;
        }

        .route-info dd {
          font-size: 13px;
        }

        .lower-note {
          align-items: flex-start;
          flex-direction: column;
          gap: 7px;
          padding-top: 14px;
          padding-bottom: 12px;
        }

        .lower-note p:last-child {
          text-align: left;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }

    </style>
  </head>
  <body class="is-riding">
    <div class="page-shell">
      <header class="topbar">
        <a class="wordmark" href="#top" aria-label="海风图鉴首页">
          <span class="wordmark-mark" aria-hidden="true"></span>
          <span>海风图鉴</span>
        </a>
        <div class="topbar-actions">
          <span class="topbar-note">一张会动的海岸插画</span>
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换明暗主题">
            <span id="themeLabel">主题</span>
          </button>
        </div>
      </header>

      <main id="top">
        <section class="hero" aria-labelledby="pageTitle">
          <div class="hero-copy">
            <p class="eyebrow">海岸线小插画</p>
            <h1 id="pageTitle">鹈鹕，<span>出发。</span></h1>
            <p class="hero-description">一只大嘴鸟，骑着小车，把海风送到每个弯道。</p>
            <div class="actions" aria-label="插画控制">
              <button class="button button-primary" id="rideToggle" type="button" aria-pressed="true">
                暂停骑行
              </button>
              <button class="button button-secondary" id="bellButton" type="button">按一下铃</button>
            </div>
          </div>

          <div class="scene-wrap">
            <div class="scene-card">
              <svg
                class="scene-art"
                viewBox="0 0 720 640"
                role="img"
                aria-labelledby="sceneTitle sceneDescription"
              >
                <title id="sceneTitle">鹈鹕骑着蓝色自行车沿海岸前进</title>
                <desc id="sceneDescription">一只白色鹈鹕骑着自行车，身后是夕阳、海浪和飞鸟。</desc>
                <defs>
                  <linearGradient id="skyGradient" x1="0" y1="0" x2="0.8" y2="1">
                    <stop offset="0" stop-color="var(--sky-top)" />
                    <stop offset="1" stop-color="var(--sky-bottom)" />
                  </linearGradient>
                  <linearGradient id="waterGradient" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="var(--water)" />
                    <stop offset="1" stop-color="var(--water-deep)" />
                  </linearGradient>
                  <linearGradient id="roadGradient" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="var(--road)" />
                    <stop offset="1" stop-color="var(--paper-deep)" />
                  </linearGradient>
                  <filter id="objectShadow" x="-30%" y="-30%" width="160%" height="180%">
                    <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#173247" flood-opacity="0.22" />
                  </filter>
                  <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="180%">
                    <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#173247" flood-opacity="0.22" />
                  </filter>
                  <clipPath id="sceneClip">
                    <rect width="720" height="640" rx="32" />
                  </clipPath>
                </defs>

                    stroke-width="19"
                  />

                  <circle cx="563" cy="120" r="97" fill="none" stroke="var(--sun)" stroke-width="1.5" opacity="0.2" />

                  <g class="cloud" fill="#fff8ea">

                    <path d="M493 208c0-13 11-24 24-24 6-16 23-26 41-20 11 3 18 10 23 20h4c14 0 25 11 25 24 0 2 0 3-1 5H494c-1-2-1-3-1-5Z" opacity="0.55" />
                  </g>

                  <g fill="none" stroke="var(--ink)" stroke-linecap="round" stroke-width="5" opacity="0.52">

                  <rect y="294" width="720" height="126" fill="url(#waterGradient)" />

                  </g>

                  <path d="M0 406c110-18 195 10 288-8 113-22 181 9 266-6 74-14 117 8 166-5v76H0Z" fill="var(--sand)" opacity="0.94" />
                  <path d="M0 445c112 22 188-18 301 2 99 17 176-18 259-2 69 14 108-3 160-5v200H0Z" fill="url(#roadGradient)" />
                  <path d="M0 471c118 21 192-16 302 5 103 20 177-15 258 1 69 14 112-2 162-5" fill="none" stroke="var(--road-line)" stroke-linecap="round" stroke-width="7" stroke-dasharray="18 20" opacity="0.74" />

                  <g fill="none" stroke="var(--water-deep)" stroke-linecap="round" stroke-width="5" opacity="0.7">
                    <path d="M58 430c6-30 12-30 18 0" />

                    <path d="M657 421c13-21 23-22 34-15" />
                  </g>

    <script>
      const root = document.documentElement;
      const body = document.body;
      const rideToggle = document.getElementById('rideToggle');
      const bellButton = document.getElementById('bellButton');
      const sceneStatus = document.getElementById('sceneStatus');
      const themeToggle = document.getElementById('themeToggle');
      const themeLabel = document.getElementById('themeLabel');

      const savedTheme = window.localStorage.getItem('pelican-bike-theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        root.dataset.theme = savedTheme;
      }

      const updateThemeLabel = () => {
        const isDark = root.dataset.theme === 'dark';
        themeLabel.textContent = isDark ? '浅色' : '深色';
        themeToggle.setAttribute('aria-label', isDark ? '切换到浅色主题' : '切换到深色主题');
      };

      const updateRideState = () => {
        const riding = body.classList.contains('is-riding');
        rideToggle.textContent = riding ? '暂停骑行' : '让它骑起来';
        rideToggle.setAttribute('aria-pressed', String(riding));
        sceneStatus.textContent = riding ? '骑行中' : '停在海风里';
      };

      rideToggle.addEventListener('click', () => {
        body.classList.toggle('is-riding');
        updateRideState();
      });

      bellButton.addEventListener('click', () => {
        body.classList.remove('is-ringing');
        void body.offsetWidth;
        body.classList.add('is-ringing');
        bellButton.textContent = '叮铃！';
        window.setTimeout(() => {
          bellButton.textContent = '按一下铃';
          body.classList.remove('is-ringing');
        }, 760);
      });

      themeToggle.addEventListener('click', () => {
        const nextTheme = root.dataset.theme === 'dark' ? 'light' : 'dark';
        root.dataset.theme = nextTheme;
        window.localStorage.setItem('pelican-bike-theme', nextTheme);
        updateThemeLabel();
      });

      updateThemeLabel();
      updateRideState();
    </script>
