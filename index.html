<!doctype html>
<html lang="zh-CN" translate="no" class="notranslate" data-theme="white">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link
      rel="icon"
      type="image/svg+xml"
      sizes="any"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2260%22%20height%3D%2260%22%20rx%3D%2215%22%20fill%3D%22%230e0d0c%22%2F%3E%3Cpath%20d%3D%22M21%2018h22v6H35v23h-6V24h-8z%22%20fill%3D%22%23fff%22%2F%3E%3Cpath%20d%3D%22M16%203.5h32%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%221%22%20stroke-linecap%3D%22round%22%20opacity%3D%22.14%22%2F%3E%3Ccircle%20cx%3D%2248%22%20cy%3D%2248%22%20r%3D%225%22%20fill%3D%22%23ff6e06%22%2F%3E%3C%2Fsvg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="Toka - AI 网关配置、凭据、日志与用量管理控制台"
    />
    <meta name="robots" content="noindex" />
    <title>Toka</title>
    <style>
      /* Critical CSS: 首屏 loading 占位，避免 React hydration 前的白屏 */
      :root {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #eef1f4;
        color: #0a0a0a;
        font-family:
          'Avenir Next', 'SF Pro Text', universalSans, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }
      .__boot__ {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-size: 14px;
        letter-spacing: 0.02em;
        color: #7d8187;
        opacity: 0.75;
      }
      .__boot__ span {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid currentColor;
        border-right-color: transparent;
        animation: __boot-spin 0.8s linear infinite;
      }
      @keyframes __boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .__boot__ span {
          animation-duration: 2.5s;
        }
      }
      :root.__booted__ .__boot__ {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="__boot__" role="status" aria-live="polite">
        <span aria-hidden="true"></span>
        <em style="font-style: normal">Loading…</em>
      </div>
    </div>
    <noscript>
      <div style="padding: 24px; font-family: sans-serif">
        This application requires JavaScript to run. Please enable it in your browser.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
